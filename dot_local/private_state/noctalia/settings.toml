config_version = 15

[audio]
enable_overdrive = true

[bar.default]
center = [ "clock", "weather", "bar" ]
end = [
    "tray",
    "spacer_4",
    "network",
    "bluetooth",
    "spacer_3",
    "volume",
    "brightness",
    "battery",
    "spacer_2",
    "keyboard_layout",
    "notifications"
]
start = [ "workspaces", "privacy", "media", "widget", "wallpaper" ]

[battery]
warning_threshold = 20

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."alexander/screen-toolkit"]
selected-ocr-lang = "eng+ukr"

[plugins]
enabled = [ "noctalia/screen_recorder", "felipeartur/ai-usagebar", "alexander/screen-toolkit" ]

[shell]
font_family = "Fira Code SemiBold"
lang = "uk-UA"
polkit_agent = true
screen_time_enabled = true

    [shell.screenshot]
    directory = "/home/nicourrrn/Pictures/Screenshots"

[theme]
builtin = "Gruvbox"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/nicourrrn/Pictures/Wallpaper/gruvbox/minimalistic"
enabled = true

    [wallpaper.default]
    path = "/home/nicourrrn/Pictures/Wallpaper/gruvbox/minimalistic/Gayskellies.png"

    [wallpaper.last]
    path = "/home/nicourrrn/Pictures/Wallpaper/gruvbox/minimalistic/Gayskellies.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/nicourrrn/Pictures/Wallpaper/gruvbox/minimalistic/Gayskellies.png"

[widget.bar]
type = "felipeartur/ai-usagebar:bar"

[widget.clock]
format = "{:%d.%m %H:%M}"

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
type = "spacer"

[widget.spacer_4]
type = "spacer"

[widget.widget]
type = "alexander/screen-toolkit:widget"