config_version = 15

[audio]
enable_overdrive = true

[bar.default]
center = [ "clock", "weather", "bar" ]
end = [
    "tray",
    "network",
    "bluetooth",
    "spacer_3",
    "volume",
    "brightness",
    "battery",
    "spacer_2",
    "keyboard_layout",
    "notifications"
]
start = [ "mpvpaper", "workspaces", "privacy", "media", "widget" ]

[battery]
warning_threshold = 20

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002", "desktop-widget-0000000000000003" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 128.0
    box_width = 544.0
    cx = 960.0
    cy = 940.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        bands = 32
        show_when_idle = true

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 416.0
    box_width = 672.0
    cx = 976.0
    cy = 540.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "calendar"

    [desktop_widgets.widget.desktop-widget-0000000000000003]
    box_height = 0.0
    box_width = 0.0
    cx = 193.0
    cy = 169.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."alexander/screen-toolkit"]
selected-ocr-lang = "eng+ukr"

[plugin_settings."noctalia/mpvpaper"]
video_directory = "/home/nicourrrn/Pictures/Wallpaper"

[plugins]
enabled = [
    "noctalia/wallhaven",
    "noctalia/screen_recorder",
    "noctalia/mpvpaper",
    "felipeartur/ai-usagebar",
    "alexander/screen-toolkit"
]

[shell]
font_family = "Fira Code SemiBold"
lang = "uk-UA"
polkit_agent = true
screen_time_enabled = true

    [shell.launcher]
    categories = false
    show_app_origin_indicator = false
    show_icons = false

        [shell.launcher.providers.calculator]
        global = false

    [shell.screenshot]
    directory = "/home/nicourrrn/Pictures/Screenshots"

[theme]
builtin = "Gruvbox"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper.default]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/home/nicourrrn/.cache/noctalia/mpvpaper/_home_nicourrrn_Pictures_Wallpaper_164386_830461339_mp4.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/nicourrrn/.cache/noctalia/mpvpaper/_home_nicourrrn_Pictures_Wallpaper_164386_830461339_mp4.jpg"

[widget.bar]
type = "felipeartur/ai-usagebar:bar"

[widget.mpvpaper]
type = "noctalia/mpvpaper:mpvpaper"

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
type = "spacer"

[widget.widget]
type = "alexander/screen-toolkit:widget"