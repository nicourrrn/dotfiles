# -*- conf -*-
# Foot — основний термінал. Довідка: man foot.ini, усі дефолти: /etc/xdg/foot/foot.ini
#
# Корисні дефолтні хоткеї (не перевизначені нижче):
#   Ctrl+Shift+N    новий термінал у поточному каталозі (fish надсилає OSC 7)
#   Ctrl+Shift+R    пошук у scrollback
#   Ctrl+Shift+O    режим посилань: підписи-літери, натискання відкриває URL
#   Ctrl+Shift+Z/X  попередній / наступний промпт (fish надсилає OSC 133)
#   Ctrl+Shift+U    введення Unicode за кодом
#   Ctrl + + / - / 0  розмір шрифту

[main]
shell=/usr/bin/fish
# Кольори генерує `theme-set` з arch-custom-os/configs/themes/<тема>/foot.ini
include=~/.config/foot/theme.ini
font=JetBrainsMono Nerd Font:size=11
pad=14x14 center
# У тайлінгу розмір задає композитор: не обрізати вікно до сітки символів
resize-by-cells=no
# Виділення мишею одразу потрапляє і в primary, і в clipboard
selection-target=both

[bell]
# Підсвітити робочий стіл, коли фоновий термінал просить уваги
urgent=yes

[scrollback]
lines=10000
multiplier=7.0

[mouse]
hide-when-typing=yes

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste
primary-paste=none
# Скопіювати вивід останньої команди (потребує OSC 133 від fish)
pipe-command-output=[wl-copy] Control+Shift+g
# Відкрити весь scrollback у nvim (пошук, копіювання шматками)
pipe-scrollback=[sh -c "f=$(mktemp) && cat - > $f && foot -e nvim -c 'normal G' $f; rm -f $f"] Control+Shift+e
# Скопіювати URL у буфер замість відкриття (той самий режим, що й Ctrl+Shift+O)
show-urls-copy=Control+Shift+y

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
